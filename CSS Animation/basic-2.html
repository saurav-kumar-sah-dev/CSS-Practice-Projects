<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      text-align: center;
    }
    #first{
      height: 60px;
      width: 130px;
      border: 5px solid;
      padding: 6px;
      color: cadetblue;
      background-color: chocolate;
      line-height: 35px;
      margin: 100px;

      position: relative;

      animation: Saurav 2s ease-in 1s reverse infinite forwards;
    }

    @keyframes Saurav{
      from{
        left: 150px;
        top: 90px;
      }

      to{
        bottom: 50px;
        right: 35px;
      }

    }
  </style>
</head>
<body>
  <div id="first">Saurav Kumar Sah</div>
</body>
</html>
