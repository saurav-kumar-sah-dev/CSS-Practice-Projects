<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform</title>
  <style>
    .box{
      height: 30px;
      width: 60px;
      margin: 100px;
      text-align: center;
      background-color: blueviolet;
      transform: translate(100px 30px);
    }
  </style>
</head>
<body>
  <p class="box">Box</p>
</body>
</html>
