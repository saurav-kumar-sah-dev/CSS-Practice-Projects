<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transition</title>
  <style>
    .box{
      background-color:chartreuse;
      height: 50px;
      width: 140px;
      margin: 20px;
      text-align: center;
      transition: all;
      transition-duration: 2s;
      transition-timing-function: ease-in-out;
      /* transition-delay: 1s; */
      line-height: 50px;
      
    
    }
    .box:hover{
      background-color: yellow;
     
    }
    .box:active{
      background-color: red;
    }
  </style>
</head>
<body>
  <p class="box">Saurav Kumar Sah</p>
</body>
</html>
