<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Color Property</title>
  <style>
    p{
      background-color: blanchedalmond;
      color: red;
      text-align: center;
      font-size: 22px;
    }
    h4{
      color: beige;
      background-color: rgb(225,75,25);
      text-align: center;
    }
    #id1{
      width: 100px;
      height: 100px;
      text-align: center;
      background-color: blueviolet;
      color: aquamarine;
    }
    .box{
      color: yellow;
      background-color: rgba(75,125,205,0.9)
    }
  </style>
</head>
<body>
  <p>Saurav Kumar Sah</p>
  <h4>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Tenetur mollitia laborum fugit sint velit!</h4>
  <h3 id="id1">Saurav Kumar Sah</h3>
  <p class="box">Saurav Kumar Sah</p>
</body>
</html>
