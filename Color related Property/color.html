<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Property</title>
  <style>

    p{
      color: aqua;
    }

    i{
      color: cadetblue;
    }
    h4{
      color: rgb(100,200,0);
    }
    #first{
      color: red;
      background-color: rgba(0,255,175,0.7); 
      text-align: center;
    }

  </style>
</head>
<body>
  <p>Saurav Kumar Sah</p>
  <i>Saurav Kumar Sah</i>
  <h4>Saurav Kumar Sah</h4>
  <p id="first">Saurav Kumar Sah</p>
</body>
</html>
