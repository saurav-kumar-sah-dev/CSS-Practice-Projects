<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEX for color Property</title>
  <style>
    p{
      color: #0011cc;
    }
    h3{
      color: blue;
      background-color: #aa880f;
      text-align: center;
    }
    .box{
      color: #0099ff;
      background-color: #dd55b1;
    }
  </style>
</head>
<body>
  <p>Saurav Kumar Sah</p>
  <h3>Saurav Kumar Sah</h3>
  <p class="box">Saurav Kumar Sah</p>
</body>
</html>
