<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Property</title>
  <style>
  #first{
    background-color: blue;
    text-align: center;
  }

  @media screen and (width:300px) {
    #first{
      background-color: red;
    }
  }
  </style>
</head>
<body>
  <p id="first">Saurav Kumar Sah</p>
</body>
</html>
