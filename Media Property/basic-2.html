<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Property</title>
  <style>
  .box{
    background-color: aqua;
  }
  @media screen and (min-width:200px) {

    .box{
      background-color: blue;
    }
  }
  </style>
</head>
<body>
  <p class="box">Saurav kumar Sah</p>
</body>
</html>
