<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Class</title>
  <style>
    .box{
      background-color: blue;
      height: 50px;
      width: 140px;
      text-align: center;
    }
    .box:hover{
      background-color: yellow;
    }
    .box:active{
      background-color: red;
    }
  </style>
</head>
<body>
  <p class="box">Saurav Kumar Sah</p>
</body>
</html>
