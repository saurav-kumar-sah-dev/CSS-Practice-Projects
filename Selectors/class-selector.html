<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Selector</title>
  <style>
    .box{
      color: aqua;
      text-align: center;
      background-color: blueviolet;
    }
    p{
      color: blue;
      font-size: 25px;
    }
    .box2{
      background-color: cadetblue;
    }
  </style>
</head>
<body>
  <div class="box">
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <h3>Saurav Kumar Sah</h3>
  </div>
  <p>Saurav Kumar Sah</p>
  <h5 class="box2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore enim aut inventore vel doloribus assumenda autem odio quae deserunt quasi?</h5>
</body>
</html>
