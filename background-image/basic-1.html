<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Image Property</title>
  <style>
    .box{
      height: 100px;
      width: 40px;
      background-image: url('./images/flipkart.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    #first{
      width: 40px;
      height: 120px;
      background-image: url('./images/myntra.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }
  </style>
</head>
<body>
  <p class="box">Flipart</p>
  <div id="first">Myntra</div>
</body>
</html>
