<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index</title>
  <style>
    .box {
      height: 400px;
      width: 400px;
      margin: 50px;
      border: 12px solid;
      border-radius: 6px;
    }

    .same {
      height: 50px;
      width: 80px;
      text-align: center;
      border: 5px solid;
      border-radius: 3px;
      margin: 10px;
    }

    #box-1 {

      background-color: red;
      position: relative;
      top: 70px;
      z-index: 4;
    }

    #box-2 {
      background-color: blue;
      position: relative;
      left: 55px;
      top: 25px;
      z-index: 3;
    }

    #box-3 {
      background-color: green;
      position: relative;
      left: 110px;
      bottom: 25px;
      z-index: 2;
    }

    #box-4 {
      background-color: yellow;
      position: relative;
      left: 165px;
      bottom: 65px;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div class="box">
    <div id="box-1" class="same">1</div>
    <div id="box-2" class="same">2</div>
    <div id="box-3" class="same">3</div>
    <div id="box-4" class="same">4</div>
</body>

</html>
